name: CI Check

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run a basic check
        run: |
          echo "Running CI check..."
          echo "Files in repo:"
          ls -la
          echo "CI passed!"
